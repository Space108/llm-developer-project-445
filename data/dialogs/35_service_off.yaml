# Успех: отключение услуги с карточкой и подтверждением.
name: 35_service_off
user: anna
turns:
  # «услугу» содержит «угу»: ответ на карточку — только целым словом
  - say: отключи услугу Музыка
    expect:
      plan_has: [tariff]
      card: true
  - say: да
    expect:
      reply_contains: ["отово"]
      state:
        service: { name: Музыка, enabled: false }
        tariff: Базовый
